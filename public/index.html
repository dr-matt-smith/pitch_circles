<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="style.css" />
  <title>Pitch Circles</title>
</head>
<body>
  <div id="piano" title="Click the keys to play them"></div>
  <nav id="levels"></nav>
  <main>
    <aside id="play" class="panel"></aside>
    <div id="stage">
      <canvas id="circles" aria-label="Tonal pitch space, drawn as concentric pitch circles"></canvas>
    </div>
    <aside id="settings" class="panel"></aside>
  </main>
  <footer id="info"></footer>
  <script src="app.js"></script>
</body>
</html>
